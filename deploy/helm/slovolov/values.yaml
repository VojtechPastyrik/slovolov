image:
  repository: ghcr.io/vojtechpastyrik/slovolov
  tag: ""            # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: slovolov.example.com
  tls:
    enabled: false
    secretName: slovolov-tls

# DragonflyDB is expected to be installed via the DragonflyDB Operator.
# https://www.dragonflydb.io/docs/managing-dragonfly/operator/kubernetes-operator
dragonfly:
  # Whether to create a Dragonfly custom resource. Set false if you manage
  # Dragonfly separately (e.g. shared instance in another namespace).
  create: true
  name: slovolov-cache
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Address the app connects to. Defaults to `<name>.<namespace>:6379`.
  addressOverride: ""

# Claude API credentials. The daily secret word, its ranked word list, and
# scores for off-list guesses all come from the Claude API.
anthropic:
  # Provide via --set-string anthropic.apiKey=sk-ant-... OR reference an
  # existing secret (ExternalSecret + 1Password in the Argo path).
  apiKey: ""
  existingSecret: ""
  existingSecretKey: anthropic-api-key
  # Optional per-job model overrides; empty means the Go client's default.
  # model picks the daily secret word (quality-critical, one call per puzzle).
  # bulkModel fills the ranking bands (eleven calls per puzzle — most of the bill).
  # guessModel rates a player's unseen guess (scales with players, not puzzles).
  model: ""
  bulkModel: ""
  guessModel: ""

puzzle:
  # Calendar day used to pick the secret word, and when it rolls over.
  timezone: Europe/Prague

# CronJobs that build the puzzles just after they roll over. The server also
# generates on demand if a job has not run, so these are a latency
# optimisation rather than a hard dependency.
#
# `daily` is the everyday word, `weekly` a harder one that lasts a whole week
# (rolls over Monday midnight).
daily:
  enabled: true
  schedule: "2 0 * * *"
  timeZone: Europe/Prague
  # Generation is a handful of model calls; give it room but not forever.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

weekly:
  enabled: true
  schedule: "6 0 * * 1"
  timeZone: Europe/Prague
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

env: {}
  # LOG_LEVEL: info
