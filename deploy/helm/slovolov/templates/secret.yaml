{{- if not .Values.openai.existingSecret }}
{{- if not .Values.openai.apiKey }}
{{- fail "openai.apiKey is required (or set openai.existingSecret to reuse an existing Secret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slovolov.openaiSecretName" . }}
  labels:
    {{- include "slovolov.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.openai.apiKey | quote }}
{{- end }}
