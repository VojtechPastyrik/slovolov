{{- /*
Only render the OpenAI Secret when the chart is the source of truth for
it. If the operator provides an existingSecret (ExternalSecret + 1Password
in the Argo path), skip.
*/}}
{{- if and (not .Values.openai.existingSecret) .Values.openai.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slovolov.openaiSecretName" . }}
  labels:
    {{- include "slovolov.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.openai.apiKey | quote }}
{{- end }}
{{- if and (not .Values.cohere.existingSecret) .Values.cohere.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slovolov.cohereSecretName" . }}
  labels:
    {{- include "slovolov.labels" . | nindent 4 }}
type: Opaque
stringData:
  cohere-api-key: {{ .Values.cohere.apiKey | quote }}
{{- end }}
{{- if and (eq .Values.embedProvider "openai") (not .Values.openai.apiKey) (not .Values.openai.existingSecret) }}
{{- fail "embedProvider=openai requires openai.apiKey or openai.existingSecret" }}
{{- end }}
{{- if and (eq .Values.embedProvider "cohere") (not .Values.cohere.apiKey) (not .Values.cohere.existingSecret) }}
{{- fail "embedProvider=cohere requires cohere.apiKey or cohere.existingSecret" }}
{{- end }}
