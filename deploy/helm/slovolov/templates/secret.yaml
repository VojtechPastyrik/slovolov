{{- /*
Only render the Claude API Secret when the chart is the source of truth for
it. If the operator provides an existingSecret (ExternalSecret + 1Password
in the Argo path), skip.
*/}}
{{- if and (not .Values.anthropic.existingSecret) (not .Values.anthropic.apiKey) }}
{{- fail "anthropic.apiKey or anthropic.existingSecret is required" }}
{{- end }}
{{- if and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slovolov.anthropicSecretName" . }}
  labels:
    {{- include "slovolov.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropic-api-key: {{ .Values.anthropic.apiKey | quote }}
{{- end }}
