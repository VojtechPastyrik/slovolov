apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slovolov.fullname" . }}
  labels:
    {{- include "slovolov.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "slovolov.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slovolov.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: server
          image: {{ include "slovolov.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: {{ include "slovolov.dragonflyAddress" . | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "slovolov.openaiSecretName" . }}
                  key: {{ include "slovolov.openaiSecretKey" . }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
